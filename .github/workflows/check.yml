name: Check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py
      - run: |
          git config user.name "status-bot"
          git config user.email "status@ironfang.uk"
          git add data
          git diff --cached --quiet || git commit -m "status data"
          git pull --rebase origin main
          git push
